appId: com.polotno.app
productName: Polotno
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!mcpb/*'
  - '!vendor/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: out/mcp-server.cjs
    to: mcp-server.cjs
  - from: out/Polotno.mcpb
    to: Polotno.mcpb
  - from: vendor/skills
    to: skills
fileAssociations:
  - ext: polotno
    name: Polotno Design
    description: Polotno design file
    role: Editor
win:
  executableName: Polotno
  # `polotno` CLI wrapper; build/installer.nsh puts resources\bin on the PATH.
  extraResources:
    - from: build/win/polotno.cmd
      to: bin/polotno.cmd
  target:
    - target: nsis
      arch: [x64, arm64]
  # Azure Trusted Signing is configured in .github/workflows/release.yml, not
  # here: whenever win.azureSignOptions is set, electron-builder runs
  # Invoke-TrustedSigning, which fails without the AZURE_* credentials (PR
  # builds in build.yml, local --win builds on macOS).
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  # Per-user one-click install (%LOCALAPPDATA%\Programs): updates install
  # without a UAC prompt, and build/win/cli-path.ps1 edits the per-user (HKCU)
  # PATH — a per-machine install would need HKLM there too.
  oneClick: true
  perMachine: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # zip is required — electron-updater consumes it; dmg is for humans.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Notarization runs in CI via APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID secrets. Local unsigned builds skip it automatically because
  # the release workflow unsets empty env vars.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  category: Graphics
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: polotno-project
  repo: polotno-studio-app
  releaseType: draft
