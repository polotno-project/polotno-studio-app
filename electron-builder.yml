appId: com.polotno.app
productName: Polotno
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!mcpb/*'
  - '!vendor/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: out/mcp-server.cjs
    to: mcp-server.cjs
  - from: out/Polotno.mcpb
    to: Polotno.mcpb
  - from: vendor/skills
    to: skills
fileAssociations:
  - ext: polotno
    name: Polotno Design
    description: Polotno design file
    role: Editor
    # Linux only: the deb registers it with shared-mime-info (glob *.polotno).
    mimeType: application/x-polotno
win:
  executableName: Polotno
  # `polotno` CLI wrapper; build/installer.nsh puts resources\bin on the PATH.
  extraResources:
    - from: build/win/polotno.cmd
      to: bin/polotno.cmd
  target:
    - target: nsis
      arch: [x64, arm64]
  # Azure Trusted Signing — set env AZURE_TENANT_ID / AZURE_CLIENT_ID /
  # AZURE_CLIENT_SECRET in CI and uncomment:
  # azureSignOptions:
  #   endpoint: https://eus.codesigning.azure.net
  #   codeSigningAccountName: polotno
  #   certificateProfileName: polotno-app
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # zip is required — electron-updater consumes it; dmg is for humans.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Notarization runs in CI via APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID secrets. Local unsigned builds skip it automatically because
  # the release workflow unsets empty env vars.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # The deb's stock after-install links /usr/bin/<executableName> (the `polotno`
  # CLI) and installs the AppArmor userns profile for /opt/Polotno/<executableName>,
  # so deb users keep the Chromium sandbox on Ubuntu 24.04+. The AppImage can't
  # carry a profile and runs with --no-sandbox there (docs/linux-testing.md).
  executableName: polotno
  # Standard hicolor sizes. A lone 1024px icon lands in hicolor/1024x1024,
  # which Ubuntu's hicolor theme doesn't define → GNOME shows a generic gear.
  icon: build/icons
  target:
    - AppImage
    - deb
  category: Graphics
  synopsis: Offline-first desktop design editor
  # Name the .desktop file after package.json desktopName (also StartupWMClass),
  # so docks group the window with its launcher. Electron takes the Wayland
  # app_id from desktopName but the X11 WM_CLASS from app.name (package.json
  # "name"), so desktopName must stay "<name>.desktop" for both to match.
  syncDesktopName: true
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
  # dpkg shows it as the package Maintainer.
  maintainer: Polotno <lavrton@gmail.com>
  vendor: Polotno
  packageCategory: graphics
  # electron-builder's default list plus ALSA: Electron links libasound.so.2,
  # which a minimal Ubuntu 24.04 lacks (the app then won't start). The t64
  # package provides libasound2, so the alternative covers 22.04/Debian too.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: polotno-project
  repo: polotno-studio-app
  releaseType: draft
