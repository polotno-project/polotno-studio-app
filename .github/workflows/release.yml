name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_POLOTNO_KEY: ${{ secrets.VITE_POLOTNO_KEY }}
      - name: Package and upload to draft release
        shell: bash
        # Missing repo secrets arrive as empty strings; electron-builder treats
        # a set-but-empty CSC_LINK as a certificate path. Unset empties so
        # unsigned builds work until the real secrets exist.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
                   AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          sign_args=()
          # Windows Azure Trusted Signing, release builds only (see the note in
          # electron-builder.yml). Uncomment once the AZURE_* secrets exist and
          # the four values below are the real ones (electron-builder 26 option
          # names; v27 moves them to win.sign with type: azure).
          # publisherName must equal the certificate subject exactly: signed
          # apps refuse updates signed under any other name, so never change it.
          # if [ "$RUNNER_OS" = Windows ] && [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
          #   sign_args=(
          #     -c.win.azureSignOptions.endpoint=https://eus.codesigning.azure.net/
          #     -c.win.azureSignOptions.codeSigningAccountName=polotno
          #     -c.win.azureSignOptions.certificateProfileName=polotno-app
          #     "-c.win.azureSignOptions.publisherName=CN=Polotno, O=Polotno, L=City, S=State, C=US"
          #   )
          # fi
          npx electron-builder --publish always "${sign_args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (set these repo secrets to enable;
          # also flip mac.notarize to true in electron-builder.yml):
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Azure Trusted Signing (also uncomment sign_args above):
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
# Publishing the draft release on GitHub is the manual go-live gate:
# electron-updater only sees published releases.
