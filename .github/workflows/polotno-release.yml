# Cuts a patch release when polotno / @polotno/* changed since the last
# release: bumps the patch version, adds a CHANGELOG entry, then pushes the
# release commit and its tag. The tag push starts release.yml, which uploads
# the installers to a draft release. Publishing the draft stays manual.
#
# Runs right after the grouped Dependabot PR is auto-merged
# (dependabot-auto-merge.yml), daily as a safety net (a merge that landed
# late, a bump merged by hand, a failed run), and on demand. Every run
# compares master with the last release tag, so extra runs are harmless.
#
# workflow_run, not push: the auto-merge is done with GITHUB_TOKEN, and its
# push to master starts no workflows. workflow_run isn't restricted for
# Dependabot, so the RELEASE_DEPLOY_KEY secret is available. That write
# deploy key is on the bypass list of the "master: require Build" ruleset,
# and unlike GITHUB_TOKEN its pushes start workflows (release.yml).
#
# Nothing from the PR is checked out or run: the job only reads the PR's
# state and works on master.
name: Polotno patch release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: polotno-release
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.login == 'dependabot[bot]' &&
        startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/polotno-')
      )
    runs-on: ubuntu-latest
    steps:
      # Auto-merge lands the PR right after Build passes. If it hasn't merged
      # within 5 minutes (a major bump, or a merge by hand later), the daily
      # run picks it up once it's on master.
      - name: Wait for the PR to merge
        id: pr
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$PR" ]; then echo "::notice::No PR on this run"; echo merged=false >> "$GITHUB_OUTPUT"; exit 0; fi
          for _ in $(seq 30); do
            merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq \
              "select(.user.login == \"dependabot[bot]\" and .base.ref == \"$BASE\"
                and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .merged")
            if [ "$merged" = true ]; then echo merged=true >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ -z "$merged" ]; then break; fi
            sleep 10
          done
          echo "::notice::PR #$PR is not merged (yet), leaving it to the daily run"
          echo merged=false >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.merged != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - if: steps.pr.outputs.merged != 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - if: steps.pr.outputs.merged != 'false'
        run: |
          version=$(node scripts/polotno-patch-release.mjs)
          if [ -z "$version" ]; then
            echo "::notice::Polotno packages match the last release, nothing to release"
            exit 0
          fi
          npm version "$version" --no-git-tag-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release $version"
          git tag "v$version"
          # Both or neither: a rejected master push must not leave a tag behind.
          # If master moved meanwhile this fails, and the next run starts over.
          git push --atomic origin "HEAD:$DEFAULT_BRANCH" "v$version"
          echo "::notice::Pushed v$version, release.yml builds the draft"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
