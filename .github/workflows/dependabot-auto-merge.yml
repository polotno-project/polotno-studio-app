# Turns on auto-merge for the grouped polotno / @polotno/* PR from
# dependabot.yml, so it lands once the required Build checks pass (ruleset
# "master: require Build"). Major bumps are left for review.
# pull_request_target is safe here: nothing from the PR is checked out or run.
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # update-type is the highest bump in the group.
      - if: >-
          steps.metadata.outputs.dependency-group == 'polotno' &&
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'),
            steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
