<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Polotno</title>
    <!-- Scripts stay local-only. Assets/fonts/API calls may reach the network:
         designs link assets by URL by design (stock photos, Google fonts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' data: blob: https:; worker-src 'self' blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
